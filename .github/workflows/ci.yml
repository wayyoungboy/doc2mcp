name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o /tmp/doc2mcp ./cmd/doc2mcp

      - name: Test
        run: go test ./...

      - name: CLI help
        run: /tmp/doc2mcp --help
